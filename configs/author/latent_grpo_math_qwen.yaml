schema_version: 1
profile_name: author-latent-grpo-math-qwen
definition: Author-published high-difficulty training truth; hardware adaptations are forbidden in this file.
provenance:
  source_file: Latent-GRPO/Latent-GRPO-math500-qwen.sh
  source_sha256: 81c5a81e72e1452367e9e4cfb2259f3030084e6ef1ae62e3c38294b897e1a480
  baseline_commit: 53438ec07b804ebd1b670d6fe118199798350505
  precedence: author_experiment_shell
environment:
  SGL_DISABLE_TP_MEMORY_INBALANCE_CHECK: true
  PYTHONUNBUFFERED: 1
  CUDA_LAUNCH_BLOCKING: 1
  HYDRA_FULL_ERROR: 1
defaults:
  data_dir: ./data
  model_path: /path/to/latent-sft-checkpoint/hf
  output_dir: ./saved/latent-grpo-math500-qwen
  gpus: 0,1,2,3,4,5,6,7
algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  exclude_overlong_samples_from_advantage: true
data:
  train_files: DAPO-Math-17k-en-train.parquet
  val_files: Math-500-test.parquet
  train_batch_size: 32
  val_batch_size: 500
  max_prompt_length: 1024
  max_response_length: 4096
  filter_overlong_prompts: true
actor:
  lr: "1e-6"
  ppo_mini_batch_size: 32
  ppo_micro_batch_size_per_gpu: 1
  use_kl_loss: true
  ppo_max_token_len_per_gpu: 20480
  kl_loss_coef: 0.001
  neg_adv_weight: 1.0
  kl_loss_type: low_var_kl
  entropy_coeff: 0
  freeze_embedding: true
model:
  use_remove_padding: true
  enable_gradient_checkpointing: true
fsdp:
  param_offload: true
  optimizer_offload: true
rollout:
  log_prob_micro_batch_size_per_gpu: 2
  max_model_len: 12000
  max_num_batched_tokens: 12000
  tensor_model_parallel_size: 1
  name: sglang
  dtype: bfloat16
  top_p: 0.95
  top_k: 30
  max_topk: 10
  temperature: 0.6
  gumbel_softmax_temperature: 1.0
  enable_latent: true
  latent_end_token_id: 522
  add_noise_gumbel_softmax: true
  use_one_sided_gumbel_noise: true
  noise_scale: 1.0
  gpu_memory_utilization: 0.8
  n: 8
validation_sampling:
  do_sample: true
  temperature: 0.6
  top_p: 0.95
  top_k: 30
ref:
  log_prob_micro_batch_size_per_gpu: 2
  strategy: fsdp2
dynamic_filtering:
  enable: true
  max_num_gen_batches: 50
trainer:
  critic_warmup: 0
  logger: [console, wandb]
  project_name: latent-grpo
  experiment_name: latent-grpo-math500-qwen
  val_before_train: true
  n_gpus_per_node: 8
  nnodes: 1
  save_freq: 40
  test_freq: 10
  default_hdfs_dir: null
  balance_batch: true
  default_local_dir: ./saved/latent-grpo-math500-qwen
  total_epochs: 5
hydra_overrides:
  actor_rollout_ref.actor.optim.lr: "1e-6"
  actor_rollout_ref.actor.ppo_max_token_len_per_gpu: 20480
  actor_rollout_ref.actor.kl_loss_coef: 0.001
  actor_rollout_ref.actor.neg_adv_weight: 1.0
  actor_rollout_ref.actor.kl_loss_type: low_var_kl
  actor_rollout_ref.actor.entropy_coeff: 0
  actor_rollout_ref.actor.freeze_embedding: true
  actor_rollout_ref.rollout.val_kwargs.do_sample: true
  actor_rollout_ref.rollout.val_kwargs.temperature: 0.6
  actor_rollout_ref.rollout.val_kwargs.top_p: 0.95
  actor_rollout_ref.rollout.val_kwargs.top_k: 30
  actor_rollout_ref.ref.strategy: fsdp2
  algorithm.use_kl_in_reward: false
  algorithm.exclude_overlong_samples_from_advantage: true
  trainer.critic_warmup: 0
  trainer.val_before_train: true
  trainer.save_freq: 40
  trainer.test_freq: 10
  trainer.balance_batch: true
  trainer.total_epochs: 5
