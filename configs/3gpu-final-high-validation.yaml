schema_version: 1
profile_name: 3gpu-final-high-validation
profile_kind: final_runtime_validation
description: Two-update High target-runtime gate; never use its results as a formal experiment.
launcher:
  mode: ray_direct
target_hardware:
  required_gpus: 3
  min_vram_gb: 40
batch:
  prompt_batch: 3
  rollout_n: 8
  mini_prompt_batch: 3
  actor_micro_batch_per_gpu: 1
  rollout_log_prob_micro_batch_per_gpu: 2
  ref_log_prob_micro_batch_per_gpu: 2
  ppo_epochs: 1
model:
  path: DJCheng/Qwen2.5-Math-7B-Latent-SFT-4k-Top10
  latent_end_token_id: 522
  latent_end_token: "</think>"
  latent_end_source: author_shell_requires_target_tokenizer_validation
  use_remove_padding: true
  enable_gradient_checkpointing: true
  actor_param_offload: true
  actor_optimizer_offload: true
  ref_param_offload: false
  use_kl_loss: true
data:
  train_files: data/DAPO-Math-17k-en-train.parquet
  val_files: data/Math-500-test.parquet
  max_prompt_length: 1024
  max_response_length: 4096
  filter_overlong_prompts: true
rollout:
  name: sglang
  dtype: bfloat16
  tensor_parallel_size: 1
  sequence_parallel_size: 1
  max_model_len: 12000
  max_num_batched_tokens: 12000
  gpu_memory_utilization: 0.8
  max_topk: 10
  temperature: 0.6
  top_p: 0.95
  top_k: 30
  gumbel_softmax_temperature: 1.0
  noise_scale: 1.0
  enable_latent: true
  add_noise_gumbel_softmax: true
  use_one_sided_gumbel_noise: true
training:
  max_steps: 2
  seed: 17
  filter_groups_max_num_gen_batches: 50
paths:
  upstream_repo_path: Latent-GRPO
  output_root: artifacts/validation/3gpu-final-high
  cache_root: cache
features:
  metrics_enabled: true
  support_enabled: true
  checkpoint_probe_enabled: true
  credit_probe_enabled: true
upstream_overrides:
  data.val_batch_size: 500
  actor_rollout_ref.actor.optim.lr: "1e-6"
  actor_rollout_ref.actor.ppo_max_token_len_per_gpu: 20480
  actor_rollout_ref.actor.kl_loss_coef: 0.001
  actor_rollout_ref.actor.neg_adv_weight: 1.0
  actor_rollout_ref.actor.kl_loss_type: low_var_kl
  actor_rollout_ref.actor.entropy_coeff: 0
  actor_rollout_ref.actor.freeze_embedding: true
  actor_rollout_ref.rollout.val_kwargs.do_sample: true
  actor_rollout_ref.rollout.val_kwargs.temperature: 0.6
  actor_rollout_ref.rollout.val_kwargs.top_p: 0.95
  actor_rollout_ref.rollout.val_kwargs.top_k: 30
  actor_rollout_ref.ref.strategy: fsdp2
  algorithm.use_kl_in_reward: false
  algorithm.exclude_overlong_samples_from_advantage: true
  trainer.critic_warmup: 0
  trainer.logger: "[console]"
  trainer.project_name: latent-grpo
  trainer.experiment_name: latent-grpo-math500-qwen-3gpu-final-validation
  trainer.val_before_train: false
  trainer.save_freq: 1
  trainer.test_freq: -1
  trainer.balance_batch: true
  trainer.total_epochs: 1
